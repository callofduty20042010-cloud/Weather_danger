{% extends 'base_layout.html' %}

{% load socialaccount %}
{% block content %}
<style>
    .social-login {
        display: grid;
        gap: 10px;
        margin-top: 16px;
    }

    .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 800;
        text-decoration: none;
    }

    .google-btn {
        background: #fff;
        color: #222;
    }

    .github-btn {
        background: #161b22;
        color: #fff;
    }
</style>
    <div class="columns is-centered" style="margin-top: 6%">
        <div class="column is-4">
            <div class="box has-background-info-light">
                <form class="form  has-text-centered" method="post">
                    <h1 class="title is-size-2 has-text-centered">Sign in</h1>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="field">
                            <label for="{{ field.id_for_label }}" class="label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button is-primary is-fullwidth">
                        Submit
                    </button>
                    <p class="content mt-3">
                        Already have an account?
                        <span>
                           <a href="{% url 'users:sign_up' %}">Sign up here</a>
                       </span>
                    </p>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
